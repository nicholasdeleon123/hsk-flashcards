<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HSK 1">
<meta name="theme-color" content="#0f0f0f">
<title>HSK 1 Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0f0f0f;--surface:#1a1a1a;--surface2:#242424;
    --border:rgba(255,255,255,0.08);--text:#f0ece4;
    --muted:rgba(240,236,228,0.45);--hint:rgba(240,236,228,0.22);
    --accent:#c8a96e;--green:#5fbe8a;--green-dim:rgba(95,190,138,0.12);
    --red:#e06868;--red-dim:rgba(224,104,104,0.12);--blue:#6ba3d6;
    --flip-duration:0.55s;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;height:100dvh;background:var(--bg);color:var(--text);
    font-family:'DM Sans',sans-serif;overflow:hidden;touch-action:manipulation}
  .app{display:flex;flex-direction:column;height:100dvh;max-width:500px;margin:0 auto;
    padding:env(safe-area-inset-top,16px) 20px env(safe-area-inset-bottom,20px)}
  .header{display:flex;align-items:center;justify-content:space-between;padding:10px 0 8px}
  .header-title{font-size:13px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
  .header-counts{font-size:13px;color:var(--muted)}
  .header-counts span{color:var(--text);font-weight:500}
  .progress-track{height:2px;background:var(--border);border-radius:99px;margin-bottom:12px;overflow:hidden}
  .progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .5s ease}
  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .stat-pill{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 4px;text-align:center}
  .stat-pill .n{font-size:18px;font-weight:500}
  .stat-pill .l{font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:.04em}
  .n-new{color:var(--blue)}.n-learn{color:var(--accent)}.n-known{color:var(--green)}.n-due{color:var(--red)}
  .scene{flex:1;perspective:1400px;margin-bottom:12px;min-height:0}

  .card{width:100%;height:100%;transform-style:preserve-3d;
    transition:transform var(--flip-duration) cubic-bezier(.4,0,.2,1);position:relative}
  .card.flipped{transform:rotateY(180deg)}

  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:20px;border:1px solid var(--border);background:var(--surface);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:2rem 1.5rem;overflow:hidden}
  .face::before{content:'';position:absolute;inset:0;
    background:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(200,169,110,.07),transparent 65%);
    pointer-events:none}
  .face.back{transform:rotateY(180deg)}

  /* Speaker button — back face only */
  .speak-btn{
    position:absolute;top:14px;left:16px;
    width:38px;height:38px;border-radius:50%;
    border:1px solid var(--border);background:var(--surface2);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:background .15s,transform .1s;
    color:var(--muted);
  }
  .speak-btn:active{transform:scale(.9);background:var(--surface)}
  .speak-btn.speaking{color:var(--accent);border-color:rgba(200,169,110,.4)}
  .speak-btn svg{width:18px;height:18px;fill:currentColor;flex-shrink:0}

  /* Back content fades in after flip */
  .back-content{display:flex;flex-direction:column;align-items:center;opacity:0}
  .card.revealed .back-content{opacity:1;transition:opacity .2s ease}

  .char{font-family:'Noto Serif SC',serif;font-size:clamp(68px,17vw,108px);font-weight:600;line-height:1;margin-bottom:12px}
  .tap-hint{font-size:12px;color:var(--hint);letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
  .tap-hint::before,.tap-hint::after{content:'';display:block;width:20px;height:1px;background:var(--hint)}
  .char-small{font-family:'Noto Serif SC',serif;font-size:22px;color:var(--hint);margin-bottom:10px}
  .pinyin{font-size:clamp(20px,5.5vw,30px);font-weight:400;color:var(--accent);letter-spacing:.04em;margin-bottom:14px;text-align:center}
  .meaning{font-size:clamp(16px,4.2vw,21px);font-weight:400;color:var(--text);text-align:center;line-height:1.5;max-width:290px}
  .pos-badge{margin-top:12px;font-size:11px;color:var(--muted);background:var(--surface2);
    border:1px solid var(--border);border-radius:99px;padding:3px 10px;letter-spacing:.05em}

  .swipe-overlay{position:absolute;inset:0;border-radius:20px;display:flex;align-items:center;
    justify-content:center;font-size:56px;opacity:0;pointer-events:none;transition:opacity .15s}
  .swipe-overlay.show{opacity:1}
  .swipe-overlay.wrong{background:rgba(224,104,104,.28)}
  .swipe-overlay.right{background:rgba(95,190,138,.28)}

  .queue-info{text-align:center;font-size:12px;color:var(--hint);margin-bottom:6px;letter-spacing:.04em}
  .btn{border-radius:14px;border:1px solid;padding:16px 12px;font-size:15px;font-weight:500;
    font-family:'DM Sans',sans-serif;cursor:pointer;display:flex;align-items:center;
    justify-content:center;gap:8px;transition:transform .1s;-webkit-appearance:none}
  .btn:active{transform:scale(.96)}
  .actions{display:flex;gap:10px;margin-bottom:8px}
  .btn-wrong{flex:1;background:var(--red-dim);border-color:rgba(224,104,104,.3);color:var(--red)}
  .btn-right{flex:1;background:var(--green-dim);border-color:rgba(95,190,138,.3);color:var(--green)}
  .btn-flip{width:100%;padding:14px;border-radius:14px;border:1px solid var(--border);
    background:var(--surface2);color:var(--muted);font-size:14px;cursor:pointer;
    font-family:'DM Sans',sans-serif;margin-bottom:8px;transition:background .15s}
  .btn-flip:active{background:var(--surface)}
  .done-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:2rem}
  .done-emoji{font-size:52px;margin-bottom:14px}
  .done-title{font-size:24px;font-weight:500;margin-bottom:6px}
  .done-stats{display:flex;gap:28px;margin:16px 0 20px}
  .done-stat .dn{font-size:28px;font-weight:500}
  .done-stat .dl{font-size:12px;color:var(--muted)}
  .done-sub{color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:24px;max-width:270px}
  .btn-restart{padding:15px 36px;border-radius:99px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);font-size:15px;font-weight:500;
    cursor:pointer;font-family:'DM Sans',sans-serif}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <div class="header-title">HSK 1 · 汉字</div>
    <div class="header-counts"><span id="pos-label">1</span> / <span id="total-label">—</span></div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="prog" style="width:0%"></div></div>
  <div class="stats-row">
    <div class="stat-pill"><div class="n n-new" id="cnt-new">—</div><div class="l">New</div></div>
    <div class="stat-pill"><div class="n n-learn" id="cnt-learn">—</div><div class="l">Learning</div></div>
    <div class="stat-pill"><div class="n n-known" id="cnt-known">—</div><div class="l">Known</div></div>
    <div class="stat-pill"><div class="n n-due" id="cnt-due">—</div><div class="l">Due</div></div>
  </div>

  <div id="main-view" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <div class="queue-info" id="queue-info"></div>
    <div class="scene" id="scene">
      <div class="card" id="card">

        <!-- FRONT — no speaker -->
        <div class="face front">
          <div class="char" id="char">爱</div>
          <div class="tap-hint">tap to reveal</div>
        </div>

        <!-- BACK — speaker here only -->
        <div class="face back">
          <button class="speak-btn" id="speak-btn" aria-label="Pronounce" onclick="event.stopPropagation();speak()">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
          </button>
          <div class="back-content" id="back-content">
            <div class="char-small" id="char-small">爱</div>
            <div class="pinyin" id="pinyin">ài</div>
            <div class="meaning" id="meaning">to love</div>
            <div class="pos-badge" id="pos-tag">verb</div>
          </div>
          <div class="swipe-overlay" id="swipe-overlay"></div>
        </div>

      </div>
    </div>
    <button class="btn-flip" id="flip-btn" onclick="flipCard()">Tap card or press here to reveal →</button>
    <div class="actions hidden" id="actions">
      <button class="btn btn-wrong" onclick="markCard(false)">✗ &nbsp;Didn't know</button>
      <button class="btn btn-right" onclick="markCard(true)">✓ &nbsp;Got it!</button>
    </div>
  </div>

  <div id="done-view" class="done-screen hidden">
    <div class="done-emoji">🏮</div>
    <div class="done-title">Session complete</div>
    <div class="done-stats">
      <div class="done-stat"><div class="dn" id="done-right" style="color:var(--green)">0</div><div class="dl">Correct</div></div>
      <div class="done-stat"><div class="dn" id="done-pct" style="color:var(--accent)">—</div><div class="dl">Accuracy</div></div>
      <div class="done-stat"><div class="dn" id="done-wrong" style="color:var(--red)">0</div><div class="dl">Missed</div></div>
    </div>
    <div class="done-sub" id="done-msg"></div>
    <button class="btn-restart" onclick="restartSession()">Study again</button>
  </div>
</div>

const KEY="hsk1_v4";
let state={cards:[],queue:[],qIdx:0,sRight:0,sWrong:0};
let flipped=false,txS=0,tyS=0;
const cardEl=document.getElementById('card');
const FLIP_MS=550;

// ── Speech ───────────────────────────────────────────────
let zhVoice=null;
function loadVoices(){
  const voices=speechSynthesis.getVoices();
  zhVoice=voices.find(v=>v.lang==='zh-TW')
         ||voices.find(v=>v.lang==='zh-CN')
         ||voices.find(v=>v.lang.startsWith('zh'))
         ||null;
}
loadVoices();
if(speechSynthesis.onvoiceschanged!==undefined)speechSynthesis.onvoiceschanged=loadVoices;

function speak(){
  if(!window.speechSynthesis)return;
  const text=document.getElementById('char').textContent;
  speechSynthesis.cancel();
  const utt=new SpeechSynthesisUtterance(text);
  utt.lang='zh-CN';utt.rate=0.85;
  if(zhVoice)utt.voice=zhVoice;
  const btn=document.getElementById('speak-btn');
  btn.classList.add('speaking');
  utt.onend=()=>btn.classList.remove('speaking');
  utt.onerror=()=>btn.classList.remove('speaking');
  speechSynthesis.speak(utt);
}

// ── SRS ──────────────────────────────────────────────────
function today(){return Math.floor(Date.now()/86400000)}

function load(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY)||"null");
    if(s&&s.cards&&s.cards.length===W.length)state.cards=s.cards;
    else initCards();
  }catch{initCards();}
  buildQueue();renderStats();showNext();
}
function initCards(){
  state.cards=W.map((_,i)=>({id:i,interval:0,ease:2.5,due:0,bucket:0}));
}
function save(){try{localStorage.setItem(KEY,JSON.stringify({cards:state.cards}));}catch{}}
function shuffle(a){
  const r=[...a];
  for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}
  return r;
}
function buildQueue(){
  const t=today();
  const due=shuffle(state.cards.filter(c=>c.bucket>0&&c.due<=t).map(c=>c.id));
  const newC=shuffle(state.cards.filter(c=>c.bucket===0).map(c=>c.id)).slice(0,Math.max(20,30-due.length));
  let q=[...due,...newC];
  if(!q.length)q=shuffle(state.cards.map(c=>c.id)).slice(0,20);
  state.queue=q;state.qIdx=0;state.sRight=0;state.sWrong=0;
}
function renderStats(){
  const t=today();
  document.getElementById('cnt-new').textContent=state.cards.filter(c=>c.bucket===0).length;
  document.getElementById('cnt-learn').textContent=state.cards.filter(c=>c.bucket>0&&c.bucket<3).length;
  document.getElementById('cnt-known').textContent=state.cards.filter(c=>c.bucket>=3).length;
  document.getElementById('cnt-due').textContent=state.cards.filter(c=>c.bucket>0&&c.due<=t).length;
  const pct=Math.round((state.qIdx/Math.max(state.queue.length,1))*100);
  document.getElementById('prog').style.width=pct+'%';
  document.getElementById('pos-label').textContent=Math.min(state.qIdx+1,state.queue.length);
  document.getElementById('total-label').textContent=state.queue.length;
  const dN=state.cards.filter(c=>c.bucket>0&&c.due<=t).length;
  const nN=state.cards.filter(c=>c.bucket===0).length;
  document.getElementById('queue-info').textContent=dN>0?`${dN} due · ${nN} new`:`${nN} new cards`;
}
function showNext(){
  speechSynthesis.cancel();
  flipped=false;
  cardEl.style.transition='none';
  cardEl.classList.remove('flipped','revealed');
  cardEl.offsetHeight;
  cardEl.style.transition='';
  document.getElementById('actions').classList.add('hidden');
  document.getElementById('flip-btn').classList.remove('hidden');
  document.getElementById('swipe-overlay').className='swipe-overlay';
  document.getElementById('speak-btn').classList.remove('speaking');
  if(state.qIdx>=state.queue.length){showDone();return;}
  const w=W[state.queue[state.qIdx]];
  document.getElementById('char').textContent=w[0];
  document.getElementById('char-small').textContent=w[0];
  document.getElementById('pinyin').textContent=w[1];
  document.getElementById('meaning').textContent=w[2];
  document.getElementById('pos-tag').textContent=w[3];
  renderStats();
}
function flipCard(){
  if(flipped)return;
  flipped=true;
  cardEl.classList.add('flipped');
  setTimeout(()=>{
    cardEl.classList.add('revealed');
    document.getElementById('flip-btn').classList.add('hidden');
    document.getElementById('actions').classList.remove('hidden');
  },FLIP_MS);
}
function markCard(correct){
  const id=state.queue[state.qIdx];
  const c=state.cards[id];
  const t=today();
  if(correct){
    state.sRight++;
    c.bucket=Math.min((c.bucket||0)+1,5);
    c.interval=c.interval<1?1:c.interval<3?3:Math.round(c.interval*c.ease);
    c.ease=Math.min(c.ease+0.1,3.0);c.due=t+c.interval;
  }else{
    state.sWrong++;
    c.bucket=Math.max((c.bucket||0)-1,0);
    c.interval=1;c.ease=Math.max(c.ease-0.2,1.3);c.due=t;
    state.queue.push(id);
  }
  state.qIdx++;save();
  const ol=document.getElementById('swipe-overlay');
  ol.className='swipe-overlay show '+(correct?'right':'wrong');
  ol.textContent=correct?'✓':'✗';
  setTimeout(showNext,320);
}
function showDone(){
  document.getElementById('main-view').style.display='none';
  document.getElementById('done-view').classList.remove('hidden');
  const r=state.sRight,w=state.sWrong,t=r+w;
  document.getElementById('done-right').textContent=r;
  document.getElementById('done-wrong').textContent=w;
  document.getElementById('done-pct').textContent=t>0?Math.round(r/t*100)+'%':'—';
  const known=state.cards.filter(c=>c.bucket>=3).length;
  document.getElementById('done-msg').textContent=`You've mastered ${known} of ${W.length} HSK 1 words. Come back tomorrow to keep your streak!`;
}
function restartSession(){
  document.getElementById('main-view').style.display='';
  document.getElementById('done-view').classList.add('hidden');
  buildQueue();renderStats();showNext();
}

document.getElementById('scene').addEventListener('click',e=>{
  if(e.target.closest('.speak-btn'))return;
  if(!flipped)flipCard();
});
document.getElementById('scene').addEventListener('touchstart',e=>{
  if(e.target.closest('.speak-btn'))return;
  txS=e.touches[0].clientX;tyS=e.touches[0].clientY;
},{passive:true});
document.getElementById('scene').addEventListener('touchend',e=>{
  if(e.target.closest('.speak-btn'))return;
  if(!flipped){flipCard();return;}
  const dx=e.changedTouches[0].clientX-txS,dy=e.changedTouches[0].clientY-tyS;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>50)markCard(dx>0);
},{passive:true});
document.addEventListener('keydown',e=>{
  if(e.key==='p'||e.key==='P'){if(flipped)speak();return;}
  if((e.key===' '||e.key==='Enter')&&!flipped){e.preventDefault();flipCard();}
  if(e.key==='ArrowRight'&&flipped)markCard(true);
  if(e.key==='ArrowLeft'&&flipped)markCard(false);
});

load();
</script>
